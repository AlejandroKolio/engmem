[project]
name = "engmem"
version = "0.1.1"
description = "Personal engineering memory for AI-assisted development"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Alexander Shakhov" },
]
keywords = ["knowledge-base", "retrieval", "bm25", "mcp", "markdown", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "pyyaml",
    # backfill reads link destinations out of a document body to derive `related`.
    # A regex cannot tell a real link from one quoted inside a code fence, and an
    # invented edge is worse than a missing one in a store built on deliberate edges.
    "markdown-it-py",
]

[project.urls]
Homepage = "https://github.com/AlejandroKolio/engmem"
Repository = "https://github.com/AlejandroKolio/engmem"
Issues = "https://github.com/AlejandroKolio/engmem/issues"

[project.scripts]
engmem = "engmem.cli:main"

[dependency-groups]
# markdown-it-py is a runtime dependency (see above) that doubles as the reference
# implementation for tests/test_commonmark_parity.py, which keeps sections.py's regex
# splitter honest against a real CommonMark parser.
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engmem"]
