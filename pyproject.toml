[project]
name = "engmem"
version = "0.1.0"
description = "Personal engineering memory for AI-assisted development"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Alexander Shakhov", email = "write.me.messages@gmail.com" },
]
keywords = ["knowledge-base", "retrieval", "bm25", "mcp", "markdown", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "pyyaml",
]

[project.urls]
Homepage = "https://github.com/AlejandroKolio/engmem"
Repository = "https://github.com/AlejandroKolio/engmem"
Issues = "https://github.com/AlejandroKolio/engmem/issues"

[project.scripts]
engmem = "engmem.cli:main"

[dependency-groups]
# markdown-it-py is a dev-only reference implementation for
# tests/test_commonmark_parity.py, which keeps the regex section splitter honest
# against a real CommonMark parser. The runtime still requires pyyaml alone.
dev = [
    "pytest",
    "markdown-it-py",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engmem"]
