version: 2
updates:
  # The actions in ci.yml and release.yml are third-party code running with repository
  # access, each pinned to a commit SHA with its release in a comment: a tag or a branch can
  # be moved under you, a SHA cannot. This keeps the pins current: a monthly PR per action that
  # has a new release.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
