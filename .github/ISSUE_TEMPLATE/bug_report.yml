name: Bug report
description: Something engmem does wrong, with the command that shows it
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Paste command output freely, but never a document from your store, a Reuse Log row,
        or `tools/gate1_report.py` output: those quote your own work. Counts are fine, content is not.
  - type: input
    id: version
    attributes:
      label: engmem version
      description: Output of `engmem --version`
      placeholder: engmem 0.1.1
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - Claude Code
        - Claude Desktop (MCP)
        - Copilot CLI
        - Copilot in the IDE
        - Terminal only
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and Python
      placeholder: macOS 15.6, Python 3.13.5
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The exact command you ran and everything it printed, stdout and stderr
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: A minimal invented document that reproduces it, if the bug depends on document content
